name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - copilot/final-security-deployment-hardening

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: hamid_portfolio_ci_test
          MYSQL_USER: portfolio_test
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hamid_portfolio_ci_test
      DB_USERNAME: portfolio_test
      DB_PASSWORD: ci-test-password
      DB_URL: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, sodium, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare CI application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate Composer manifest and audit packages
        run: |
          composer validate --strict --no-interaction
          composer audit --no-interaction

      - name: Check PHP formatting and syntax
        run: |
          vendor/bin/pint --test
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit and build JavaScript
        run: |
          npm audit --no-fund
          npm run build
          node --check ../app.mjs
          node --check ../portfolio-data.mjs
          find resources/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Compile Laravel views
        run: php artisan view:cache

      - name: Run isolated MySQL tests
        env:
          APP_ENV: testing
        run: |
          php artisan portfolio:test-database:verify
          php artisan test --display-skipped

      - name: Install Edge for browser tests
        if: matrix.php == '8.3'
        run: npx playwright install msedge --with-deps

      - name: Install cross-engine browsers
        if: matrix.php == '8.3'
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Prepare isolated browser database
        if: matrix.php == '8.3'
        env:
          MYSQL_PWD: ci-root-password
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --user=root --execute="CREATE DATABASE hamid_portfolio_qa_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON hamid_portfolio_qa_test.* TO 'portfolio_test'@'%';"
          APP_ENV=testing DB_DATABASE=hamid_portfolio_qa_test php artisan portfolio:test-database:verify
          DB_DATABASE=hamid_portfolio_qa_test php artisan migrate --seed --force

      - name: Create temporary browser administrator
        if: matrix.php == '8.3'
        env:
          DB_DATABASE: hamid_portfolio_qa_test
        run: |
          password="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$password"
          mkdir -p "$RUNNER_TEMP/qa-screenshots"
          printf '{"email":"qa-browser@example.test","password":"%s"}' "$password" > "$RUNNER_TEMP/qa-credentials.json"
          export QA_ADMIN_PASSWORD="$password"
          php artisan tinker --execute='$user = new App\Models\User; $user->name = "QA Browser Admin"; $user->email = "qa-browser@example.test"; $user->password = Illuminate\Support\Facades\Hash::make(getenv("QA_ADMIN_PASSWORD")); $user->is_admin = true; $user->save();'

      - name: Start isolated QA server
        if: matrix.php == '8.3'
        env:
          DB_DATABASE: hamid_portfolio_qa_test
          SESSION_DRIVER: file
        run: |
          php artisan serve --host=127.0.0.1 --port=8147 > "$RUNNER_TEMP/qa-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8147/up; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qa-server.log"
          exit 1

      - name: Run real-browser regressions
        if: matrix.php == '8.3'
        env:
          QA_DATABASE: hamid_portfolio_qa_test
          QA_CREDENTIAL_FILE: ${{ runner.temp }}/qa-credentials.json
          QA_SCREENSHOT_DIR: ${{ runner.temp }}/qa-screenshots
        run: npm run test:browser
